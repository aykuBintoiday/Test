<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Danh sách sinh viên</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 40px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        color: #1f2937;
      }

      .btn-add {
        display: inline-block;
        background: #2563eb;
        color: white;
        padding: 10px 16px;
        border-radius: 6px;
        text-decoration: none;
        margin-bottom: 20px;
      }

      .btn-add:hover {
        background: #1d4ed8;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #2563eb;
        color: white;
        padding: 12px;
      }

      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: center;
      }

      tr:hover {
        background: #f1f5f9;
      }

      .btn-edit {
        background: #f59e0b;
        color: white;
        padding: 6px 10px;
        border-radius: 5px;
        text-decoration: none;
      }

      .btn-delete {
        background: #dc2626;
        color: white;
        padding: 6px 10px;
        border-radius: 5px;
        text-decoration: none;
        margin-left: 5px;
      }

      .btn-edit:hover {
        background: #d97706;
      }

      .btn-delete:hover {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Danh sách sinh viên</h2>

      <a href="/them" class="btn-add"> + Thêm sinh viên tốt nghiệp </a>

      <table>
        <tr>
          <th>Số CMND</th>
          <th>Họ tên</th>
          <th>Email</th>
          <th>Số điện thoại</th>
          <th>Địa chỉ</th>
          <th>Thao tác</th>
        </tr>

        <tr th:each="sv : ${sinhviens}">
          <td th:text="${sv.soCMND}"></td>
          <td th:text="${sv.hoTen}"></td>
          <td th:text="${sv.email}"></td>
          <td th:text="${sv.soDT}"></td>
          <td th:text="${sv.diaChi}"></td>

          <td>
            <a th:href="@{'/sua/' + ${sv.soCMND}}" class="btn-edit"> Sửa </a>

            <a
              th:href="@{'/xoa/' + ${sv.soCMND}}"
              class="btn-delete"
              onclick="
                return confirm('Bạn có chắc muốn xóa sinh viên này không?');
              "
            >
              Xóa
            </a>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
