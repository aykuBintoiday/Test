<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm sinh viên</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef2f7;
        margin: 0;
        padding: 40px;
      }

      .form-box {
        width: 550px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      }

      h2 {
        text-align: center;
        color: #1f2937;
      }

      label {
        font-weight: bold;
        color: #374151;
      }

      input,
      select {
        width: 100%;
        padding: 9px;
        margin-top: 6px;
        margin-bottom: 6px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
      }

      .field {
        margin-bottom: 12px;
      }

      .error {
        color: #dc2626;
        font-size: 14px;
        margin-bottom: 8px;
      }

      button {
        width: 100%;
        background: #16a34a;
        color: white;
        padding: 11px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        margin-top: 8px;
      }

      button:hover {
        background: #15803d;
      }

      .back {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="form-box">
      <h2>Thêm sinh viên tốt nghiệp</h2>

      <form action="/luu" method="post" th:object="${sinhVienForm}">
        <div class="field">
          <label>Số CMND:</label>
          <input type="text" th:field="*{soCMND}" />
          <div
            class="error"
            th:if="${#fields.hasErrors('soCMND')}"
            th:errors="*{soCMND}"
          ></div>
        </div>

        <div class="field">
          <label>Họ tên:</label>
          <input type="text" th:field="*{hoTen}" />
        </div>

        <div class="field">
          <label>Email:</label>
          <input type="email" th:field="*{email}" />
        </div>

        <div class="field">
          <label>Số điện thoại:</label>
          <input type="text" th:field="*{soDT}" />
        </div>

        <div class="field">
          <label>Địa chỉ:</label>
          <input type="text" th:field="*{diaChi}" />
        </div>

        <div class="field">
          <label>Trường:</label>
          <select th:field="*{maTruong}">
            <option value="">-- Chọn trường --</option>
            <option
              th:each="t : ${truongs}"
              th:value="${t.maTruong}"
              th:text="${t.tenTruong}"
            ></option>
          </select>
          <div
            class="error"
            th:if="${#fields.hasErrors('maTruong')}"
            th:errors="*{maTruong}"
          ></div>
        </div>

        <div class="field">
          <label>Ngành:</label>
          <select th:field="*{maNganh}">
            <option value="">-- Chọn ngành --</option>
            <option
              th:each="n : ${nganhs}"
              th:value="${n.maNganh}"
              th:text="${n.tenNganh}"
            ></option>
          </select>
          <div
            class="error"
            th:if="${#fields.hasErrors('maNganh')}"
            th:errors="*{maNganh}"
          ></div>
        </div>

        <div class="field">
          <label>Hệ tốt nghiệp:</label>
          <input type="text" th:field="*{heTN}" />
        </div>

        <div class="field">
          <label>Ngày tốt nghiệp:</label>
          <input type="date" th:field="*{ngayTN}" />
          <div
            class="error"
            th:if="${#fields.hasErrors('ngayTN')}"
            th:errors="*{ngayTN}"
          ></div>
        </div>

        <div class="field">
          <label>Loại tốt nghiệp:</label>
          <input type="text" th:field="*{loaiTN}" />
        </div>

        <button type="submit">Lưu thông tin</button>
      </form>

      <a href="/" class="back"> ← Quay lại danh sách </a>
    </div>
  </body>
</html>
