<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Tìm kiếm tốt nghiệp và việc làm</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dcfce7, #f8fafc);
        margin: 0;
        padding: 40px;
      }

      .container {
        max-width: 1200px;
        margin: auto;
        background: white;
        padding: 28px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      h2 {
        text-align: center;
        color: #166534;
        margin-bottom: 25px;
      }

      .search-box {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
      }

      input {
        flex: 1;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
      }

      button {
        background: #16a34a;
        color: white;
        border: none;
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover {
        background: #15803d;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 10px;
        overflow: hidden;
      }

      th {
        background: #16a34a;
        color: white;
        padding: 13px;
      }

      td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #e5e7eb;
      }

      tr:hover {
        background: #f0fdf4;
      }

      .back {
        display: inline-block;
        margin-top: 20px;
        color: #15803d;
        text-decoration: none;
        font-weight: bold;
      }

      .empty {
        text-align: center;
        color: #64748b;
        padding: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Tìm kiếm thông tin tốt nghiệp và việc làm</h2>

      <form
        action="/timkiem-totnghiep-vieclam/ketqua"
        method="get"
        class="search-box"
      >
        <input
          type="text"
          name="keyword"
          th:value="${keyword}"
          placeholder="Nhập CMND, họ tên, mã ngành, mã trường, công ty..."
          required
        />
        <button type="submit">Tìm kiếm</button>
      </form>

      <table>
        <tr>
          <th>SoCMND</th>
          <th>Họ tên</th>
          <th>Mã ngành TN</th>
          <th>Mã trường TN</th>
          <th>Mã ngành công ty</th>
          <th>Tên công ty</th>
          <th>Thời gian làm việc</th>
        </tr>

        <tr th:if="${results != null and #lists.isEmpty(results)}">
          <td colspan="7" class="empty">Không tìm thấy thông tin phù hợp.</td>
        </tr>

        <tr th:each="row : ${results}">
          <td th:text="${row[0]}"></td>
          <td th:text="${row[1]}"></td>
          <td th:text="${row[2]}"></td>
          <td th:text="${row[3]}"></td>
          <td th:text="${row[4]}"></td>
          <td th:text="${row[5]}"></td>
          <td th:text="${row[6]}"></td>
        </tr>
      </table>

      <a href="/" class="back">← Quay lại danh sách</a>
    </div>
  </body>
</html>
